defaults:
  - base.yaml
  - _self_

env_name: "PouringEnv-v0"

rew:
  align_pos_right: 0.05
  align_ori_right: 0.05
  reach_right: 0.05
  lift_right: 4.0
  move_right: 2.0
  move_ori_right: 4.0
  cmd_wait_right: 0.0  # 500.0s
  cmd_success_right: 20.0
  align_pos_left: 0.05
  align_ori_left: 0.05
  move_left: 8.0
  move_ori_left: 0.5
  cmd_success_left: 20.0
  success_bonus: 2000.0

  energy: 0.000001
  energy_left: 0.000001
  collision_to_table: -0.000001
  collision_to_table_left: -0.000001

randomize:
  enable: False
  update_freq: 100
  eval: False
  total_step: 10
  # success_threshold: 0.7
  randomization:
    object_mass: [0.11, 0.11]   #[0.02, 0.12]
    static_friction: [0.2, 1.0]
    dynamic_friction: [0.2, 1.0]
    restitution: [0.0, 1.0]
  curriculum:
    action_scale: [0.05, 0.04, 0.03]
    energy_penalty: 
      names: ["energy", "energy_left"]
      values: [0.000001, 0.001]
    collision_penalty: 
      names: ["collision_to_table", "collision_to_table_left"]
      values: [-0.000001, -500.0]
