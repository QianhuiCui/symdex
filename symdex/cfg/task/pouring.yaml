cam:
  enable: True
  num_cams: 1
  frame_stack: 1
  resolution: 128
  cam_params:
    cam_1:
      enable: True
      randomize: False
      pos: [-0.5, 0.0, 0.45]
      target: [0.18, 0.0, 0.08]
      horizontal_aperture: 32.0 

multi:
  shared_obs_dim: 138
  SYMDEX:
  single_agent_action_dim: 22
  swap_action: True
  single_agent_obs_dim: []
  single_agent_obs_idx: [[[], [], [], []], 
                        [[], [], [], []]]
  single_agent_rew: [[],
                     []]

symmetry:
  symmetric_envs: False
  reset_symmetry:
    object_0:
      type: "rigid_object"
      symmetry: ['position']
    object_1:
      type: "rigid_object"
      symmetry: ['position']
    object_2:
      type: "rigid_object"
      symmetry: ['position']
    target_pos:
      type: "command"
      symmetry: ['position']
    waiting_pos:
      type: "command"
      symmetry: ['position']
  SYMDEX:
    # actor network
    actor_input_fields: [[], 
                        []]
    actor_output_fields: [["Q_js"], ["Q_js"]]  # 22
    # critic network
    critic_input_fields: [[],
                          []] 
    critic_output_fields: [["irrep_0"], ["irrep_0"]] # 1