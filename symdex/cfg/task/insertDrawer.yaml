defaults:
  - base.yaml
  - _self_

env_name: "InsertDrawerEnv-v0"
rew: 
  # right
  reaching_object: 0.01  # 0.02
  object_lifting: 5.0  #1.0
  object_goal_tracking: 50.0  #20.0
  object_in_drawer: 100.0
  reset_robot_joint_pos: 1.0
  # left
  reaching_handle: 0.01
  moving_drawer: 10
  moving_drawer_inside: 10
  success_bonus: 5000

  energy: 0.000001
  energy_left: 0.000001
  collision_to_table: 0.000001
  collision_to_drawer: 0.000001

cam:
  enable: True
  num_cams: 1
  frame_stack: 1
  resolution: 84
  cam_params:
    cam_1:
      enable: True
      randomize: False
      pos: [-0.5, 0.0, 0.45]
      target: [0.18, 0.0, 0.08]
      horizontal_aperture: 32.0 
      # pos: [0.6, 0.0, 1.0]
      # target: [0.13, 0.0, 0.26]

randomize: 
  enable: False
  update_freq: 100
  eval: False
  total_step: 10
  # success_threshold: 0.7
  randomization:
    object_mass: [0.11, 0.11]
    static_friction: [0.24, 1.6]
    dynamic_friction: [0.24, 1.6]
    restitution: [0.0, 1.0]
