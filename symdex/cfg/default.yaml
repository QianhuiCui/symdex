defaults:
  - algo: symdex_algo
  - task: boxLift
  - logging: default
  - _self_

env_name: "boxLift-v0"
num_envs: 4096
device: 'cuda:0'
sim_device: ${.device}
rl_device: ${.device}
graphics_device_id: 0

seed: 42  # 42  # -1 for teleop
max_step: null
max_time: 36000 # in seconds
eval_headless: True
headless: True
                      
artifact: null
artifact_critic: null
save_model: False

logger: False
max_episodes: 5  # for teleop data collection
max_episode_length: 2000
dataset_path: null  # path to dataset h5 file

replay:
  show_vision: False
  show_pc: False
  point_size: 2.0
  compare_policy: False
  max_steps: -1
  vision_scale: 4
  print_every: 5
  pc_every_n_steps: 5